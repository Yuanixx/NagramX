name: Visibility watchdog

on:
  workflow_run:
    workflows:
      - Staging build
    types:
      - completed
  # Last line of defence. A cancelled Staging run can leave the repository
  # public: the restore_visibility job only runs while the run still has a
  # runner, so cancelling it early (or cancelling it while the restore job is
  # still queued) skips the restore entirely. The workflow_run trigger above
  # normally catches that, but if it is itself cancelled or fails there is
  # nothing left to retry. This sweep makes the repository private again
  # within half an hour even when every event-driven path is lost.
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: visibility-watchdog
  # Never cancel a sweep that may be mid-restore. Consecutive Staging runs
  # finish seconds apart; queueing them costs a few seconds and guarantees
  # each one actually checks the visibility.
  cancel-in-progress: false

jobs:
  restore:
    name: Restore private visibility
    runs-on: ubuntu-latest
    steps:
      - name: Make the repository private when no build is running
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
          RUNS_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "No admin token configured; nothing to restore."
            exit 0
          fi
          # A cancelled run can leave the repository public. Only restore it
          # when nothing else is queued or running: a second build toggles
          # the visibility on its own and must not be cut in half.
          if ! busy=$(GH_TOKEN="$RUNS_TOKEN" gh run list \
                 --repo "$GITHUB_REPOSITORY" \
                 --workflow staging.yml \
                 --limit 20 \
                 --json status \
                 --jq '[.[] | select(.status == "in_progress" or .status == "queued" or .status == "waiting" or .status == "pending" or .status == "requested")] | length'); then
            echo "Could not list staging runs; restoring privacy anyway."
            busy=0
          fi
          if [ "$busy" != "0" ]; then
            echo "A staging build is still running or queued; keeping the current visibility."
            exit 0
          fi
          current=$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility || echo unknown)
          if [ "$current" = "public" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY" -f visibility=private
            echo "Repository restored to private."
          else
            echo "Repository is already $current."
          fi
