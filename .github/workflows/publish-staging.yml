name: Publish staging

# Manual gate: this is the only workflow that touches the public mirror.
# It downloads the artifact of a finished Staging build, so what is published
# is exactly the APK that was installed and accepted, not a fresh compile.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Staging build run id (Actions -> Staging build -> run id)'
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: staging-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish accepted build
    runs-on: ubuntu-latest
    steps:
      - name: Download the accepted artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          # Only a successful Staging build may be published, and the run id
          # in its build info must match what was requested.
          info=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --json workflowName,conclusion,headBranch \
            --jq '[.workflowName,.conclusion,.headBranch] | @tsv')
          IFS=$'\t' read -r wf conclusion branch <<< "$info"
          if [ "$wf" != "Staging build" ] || [ "$conclusion" != "success" ]; then
            echo "::error::Run $RUN_ID is not a successful Staging build ($wf/$conclusion)."
            exit 1
          fi
          rm -rf staging
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name Staging --dir staging
          test -f staging/build-info.json
          actual=$(jq -r '.runId' staging/build-info.json)
          if [ "$actual" != "$RUN_ID" ]; then
            echo "::error::Build info belongs to run $actual, not $RUN_ID."
            exit 1
          fi
          # A restored build directory must never silently publish a stale
          # APK: compare the downloaded bytes with the hashes recorded when
          # the build produced them.
          arm64_sha=$(jq -r '.arm64Sha // empty' staging/build-info.json)
          universal_sha=$(jq -r '.universalSha // empty' staging/build-info.json)
          if [ -z "$arm64_sha" ] || [ -z "$universal_sha" ]; then
            echo "::error::Build info has no APK checksums; refusing to publish."
            exit 1
          fi
          arm64_file=$(ls staging/*-arm64-v8a.apk | head -n1)
          universal_file=$(ls staging/*-universal.apk | head -n1)
          for pair in "$arm64_file:$arm64_sha" "$universal_file:$universal_sha"; do
            file=${pair%:*}
            want=${pair##*:}
            got=$(sha256sum "$file" | cut -d' ' -f1)
            if [ "$got" != "$want" ]; then
              echo "::error::APK $file does not match the build ($got != $want)."
              exit 1
            fi
          done
          # Print only the fields we use; older artifacts may carry text we
          # must not push into a public log.
          jq '{version,versionCode,commit,builtAt}' staging/build-info.json

      - name: Read build info
        id: info
        run: |
          INFO=staging/build-info.json
          echo "version=$(jq -r '.version' "$INFO")" >> "$GITHUB_OUTPUT"
          echo "versionCode=$(jq -r '.versionCode' "$INFO")" >> "$GITHUB_OUTPUT"
          echo "commit=$(jq -r '.commit' "$INFO")" >> "$GITHUB_OUTPUT"
          echo "builtAt=$(jq -r '.builtAt' "$INFO")" >> "$GITHUB_OUTPUT"

      - name: Publish to the update mirror
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
          VERSION_NAME: ${{ steps.info.outputs.version }}
          VERSION_CODE: ${{ steps.info.outputs.versionCode }}
          COMMIT_ID: ${{ steps.info.outputs.commit }}
          BUILD_TIMESTAMP: ${{ steps.info.outputs.builtAt }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "No admin token configured; cannot publish."
            exit 1
          fi
          MIRROR=Yuanixx/NagramX-releases
          ARM64="StreamX-${VERSION_NAME}-arm64-v8a.apk"
          UNIVERSAL="StreamX-${VERSION_NAME}-universal.apk"
          # Never copy a commit message verbatim into a public Release: it can
          # carry paths, hosts or credentials. Use a fixed plain-language line.
          NOTES='这一版改好了视频拖动时的画面预览，已经过真机验收。'
          rm -rf mirror
          mkdir -p mirror
          cp "$(ls staging/*-arm64-v8a.apk | head -n1)" "mirror/$ARM64"
          cp "$(ls staging/*-universal.apk | head -n1)" "mirror/$UNIVERSAL"
          {
            echo "已验收的构建。"
            echo
            echo "- Commit: $COMMIT_ID"
            echo "- Version: $VERSION_NAME ($VERSION_CODE)"
            echo
            echo "$NOTES"
          } > mirror/notes.md
          BUILD_TIMESTAMP="${BUILD_TIMESTAMP:-0}"
          jq -n \
            --arg version "$VERSION_NAME" \
            --argjson versionCode "$VERSION_CODE" \
            --arg commit "$COMMIT_ID" \
            --argjson builtAt "$BUILD_TIMESTAMP" \
            --arg notes "$NOTES" \
            --arg arm64 "$ARM64" \
            --arg universal "$UNIVERSAL" \
            '{version:$version, versionCode:$versionCode, commit:$commit, builtAt:$builtAt, notes:$notes, arm64:$arm64, universal:$universal}' \
            > mirror/update.json
          gh release delete staging --repo "$MIRROR" --yes --cleanup-tag=false 2>/dev/null || true
          gh release create staging \
            --repo "$MIRROR" \
            --title "Staging build" \
            --notes-file mirror/notes.md \
            "mirror/$ARM64" \
            "mirror/$UNIVERSAL" \
            mirror/update.json
          gh release view staging --repo "$MIRROR" --json assets \
            --jq '.assets[].name'
