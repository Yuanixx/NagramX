name: Staging build

on:
  push:
    branches:
      - dev
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/staging.yml'
  workflow_dispatch:

permissions:
  contents: write

# One staging build at a time: two builds must never fight over the
# repository visibility or over the staging release tag.
concurrency:
  group: staging-build
  cancel-in-progress: false

jobs:
  build:
    name: Gradle Build
    runs-on: ubuntu-latest
    outputs:
      build_timestamp: ${{ steps.staging_build_step.outputs.build_timestamp }}
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_HARDLINK: "true"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "10G"
      NATIVE_TARGET: "universal"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          append-timestamp: false
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true
      - name: Set up Gradle cache
        uses: actions/cache@v6
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('**/*.gradle') }}
      - name: Set up Android SDK Tools
        uses: android-actions/setup-android@v4
        with:
          packages: "build-tools;36.0.0 ndk;27.2.12479018 platforms;android-37.0"
      - name: Install Native Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes nasm
      - name: Configure Android SDK Path
        run: |
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties
      # Builds on GitHub are signed with a throwaway key that lives in the
      # actions cache, never in the repository and never in secrets. The cache
      # keeps the key identical between runs so artifacts can install over
      # each other. If the cache is evicted a new key is generated and the
      # signature changes; bump the cache key below to force a deliberate one.
      - name: Restore CI signing key
        uses: actions/cache@v6
        with:
          path: TMessagesProj/release.keystore
          key: ci-signing-key-v1
      - name: Set up CI signing
        if: ${{ !startsWith(runner.os, 'Windows') }}
        run: |
          # The repository ships the upstream signing key, whose password CI
          # does not have. Replace anything that is not the cached throwaway
          # key with a fresh one; the cache keeps that key identical between
          # runs so CI artifacts can install over each other.
          if ! keytool -list -keystore TMessagesProj/release.keystore \
                 -storepass android -alias androiddebugkey >/dev/null 2>&1; then
            rm -f TMessagesProj/release.keystore
            keytool -genkeypair -v -keystore TMessagesProj/release.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=NagramX CI, OU=CI, O=NagramX, L=Internet, ST=Internet, C=US"
          fi
          {
            echo "KEYSTORE_PASS=android"
            echo "ALIAS_NAME=androiddebugkey"
            echo "ALIAS_PASS=android"
          } >> local.properties
      - name: Modify Gradle JVM Args
        run: |
          MEMORY_KB=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          MEMORY_GB=$((MEMORY_KB / 1024 / 1024))
          echo "Detected memory size: ${MEMORY_GB}GB"
          if [ $MEMORY_GB -ge 12 ]; then
            sed -i '/^org\.gradle\.jvmargs=/d' gradle.properties
            echo "org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=2G -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties
          fi
          cat gradle.properties
      - name: Make repository public for the build
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "No admin token configured; building privately."
            exit 0
          fi
          current=$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)
          if [ "$current" != "public" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY" -f visibility=public
            echo "Repository is public for this run."
          else
            echo "Repository is already public."
          fi
      - name: Staging Build
        id: staging_build_step
        env:
          COMMIT_ID: ${{ github.sha }}
        run: |
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          export BUILD_TIMESTAMP=$(date +%s)
          echo "build_timestamp=$BUILD_TIMESTAMP" >> "$GITHUB_OUTPUT"
          ./gradlew TMessagesProj:assembleStaging
      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          TAG=staging
          gh release delete "$TAG" --yes --cleanup-tag=false 2>/dev/null || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" 2>/dev/null || true
          {
            echo "自动构建，对应最近的代码改动。"
            echo
            echo "- Commit: $GITHUB_SHA"
            echo "- Run: $GITHUB_RUN_NUMBER"
            echo
            echo "$COMMIT_MESSAGE"
          } > notes.md
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Staging build" \
            --notes-file notes.md \
            TMessagesProj/build/outputs/apk/staging/*-arm64-v8a.apk \
            TMessagesProj/build/outputs/apk/staging/*-universal.apk
      - name: Publish to update mirror
        # The app reads updates from this public repository. A failure here
        # must not fail the build; the source release above stays available.
        continue-on-error: true
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
          COMMIT_ID: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'Manual staging build' }}
          BUILD_TIMESTAMP: ${{ steps.staging_build_step.outputs.build_timestamp }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "No admin token configured; skipping the update mirror."
            exit 0
          fi
          MIRROR=Yuanixx/NagramX-releases
          META=TMessagesProj/build/outputs/apk/staging/output-metadata.json
          VERSION_NAME=$(jq -r '.elements[0].versionName' "$META")
          VERSION_CODE=$(jq -r '.elements[0].versionCode' "$META")
          ARM64=$(basename "$(ls TMessagesProj/build/outputs/apk/staging/*-arm64-v8a.apk | head -n1)")
          UNIVERSAL=$(basename "$(ls TMessagesProj/build/outputs/apk/staging/*-universal.apk | head -n1)")
          BUILD_TIMESTAMP="${BUILD_TIMESTAMP:-0}"
          jq -n \
            --arg version "$VERSION_NAME" \
            --argjson versionCode "$VERSION_CODE" \
            --arg commit "$COMMIT_ID" \
            --argjson builtAt "$BUILD_TIMESTAMP" \
            --arg notes "$COMMIT_MESSAGE" \
            --arg arm64 "$ARM64" \
            --arg universal "$UNIVERSAL" \
            '{version:$version, versionCode:$versionCode, commit:$commit, builtAt:$builtAt, notes:$notes, arm64:$arm64, universal:$universal}' \
            > update.json
          gh release delete staging --repo "$MIRROR" --yes --cleanup-tag=false 2>/dev/null || true
          gh release create staging \
            --repo "$MIRROR" \
            --title "Staging build" \
            --notes-file notes.md \
            TMessagesProj/build/outputs/apk/staging/*-arm64-v8a.apk \
            TMessagesProj/build/outputs/apk/staging/*-universal.apk \
            update.json
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Staging
          path: |
            TMessagesProj/build/outputs/apk/staging/*-arm64-v8a.apk
            TMessagesProj/build/outputs/apk/staging/*-universal.apk
      - name: Make repository private again
        if: always()
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "No admin token configured; visibility left unchanged."
            exit 0
          fi
          current=$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)
          if [ "$current" = "public" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY" -f visibility=private
            echo "Repository is private again."
          else
            echo "Repository is already $current."
          fi
