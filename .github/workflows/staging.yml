name: Staging build

on:
  push:
    branches:
      - dev
    paths-ignore:
      - '**.md'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read

# One staging build at a time: two builds must never fight over the
# repository visibility or over the staging release tag.
concurrency:
  group: staging-build
  cancel-in-progress: false

jobs:
  prepare_visibility:
    name: Prepare repository visibility
    runs-on: ubuntu-latest
    outputs:
      original_visibility: ${{ steps.visibility.outputs.original_visibility }}
    steps:
      - name: Make repository public before build runner allocation
        id: visibility
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::REPO_ADMIN_TOKEN is required to obtain the public-repository runner tier."
            exit 1
          fi

          original="$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)"
          echo "original_visibility=$original" >> "$GITHUB_OUTPUT"
          echo "Repository visibility before build allocation: $original"

          if [[ "$original" == "private" ]]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY" -f visibility=public
            current="$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)"
            if [[ "$current" != "public" ]]; then
              echo "::error::Repository visibility did not become public (current: $current)."
              exit 1
            fi
            echo "Repository is public. The dependent Gradle job will now be allocated."
          elif [[ "$original" == "public" ]]; then
            echo "Repository was already public; no visibility change is needed."
          else
            echo "::error::Unexpected repository visibility: $original"
            exit 1
          fi

  build:
    name: Gradle Build
    needs: prepare_visibility
    runs-on: ubuntu-latest
    outputs:
      build_timestamp: ${{ steps.staging_build_step.outputs.build_timestamp }}
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_HARDLINK: "true"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "10G"
      CCACHE_COMPRESS: "true"
      CCACHE_SLOPPINESS: "time_macros"
      NATIVE_TARGET: "arm64-v8a"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive
      # ubuntu-latest ships with ~14 GB of toolchains this Android build never uses.
      # With ccache (10G) + a cached TMessagesProj/build, Gradle's desugar/resource steps
      # ran out of space ("Could not pack tree ... No space left on device"). Drop the
      # unused SDKs/images before building; the Android SDK/NDK we need is installed below.
      - name: Free up disk space
        run: |
          df -h . | tail -1
          sudo rm -rf /usr/share/dotnet \
                      /usr/local/lib/android/sdk/system-images \
                      /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/local/share/powershell \
                      /usr/lib/jvm/java-8-openjdk-amd64 \
                      "$AGENT_TOOLSDIRECTORY/boost" 2>/dev/null || true
          df -h . | tail -1
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      # Detect the resources actually available to this job. nproc can report
      # CPUs outside a container quota, so cap it by cgroup cpu.max as well.
      # Restore the historical 4-worker / 8G profile on the 4-core / 16GB tier.
      - name: Detect runner resources and tune Gradle
        env:
          ORIGINAL_VISIBILITY: ${{ needs.prepare_visibility.outputs.original_visibility }}
        shell: bash
        run: |
          set -euo pipefail

          HOST_CPUS="$(nproc)"
          EFFECTIVE_CPUS="$HOST_CPUS"
          HOST_MEM_KB="$(awk '/MemTotal/ {print $2}' /proc/meminfo)"
          HOST_MEM_BYTES="$((HOST_MEM_KB * 1024))"
          CGROUP_MEM_BYTES="unlimited"
          EFFECTIVE_MEM_BYTES="$HOST_MEM_BYTES"

          if [[ -r /sys/fs/cgroup/cpu.max ]]; then
            read -r CPU_QUOTA CPU_PERIOD < /sys/fs/cgroup/cpu.max
            if [[ "$CPU_QUOTA" != "max" && "$CPU_QUOTA" =~ ^[0-9]+$ && "$CPU_PERIOD" =~ ^[0-9]+$ && "$CPU_PERIOD" -gt 0 ]]; then
              QUOTA_CPUS=$((CPU_QUOTA / CPU_PERIOD))
              (( QUOTA_CPUS < 1 )) && QUOTA_CPUS=1
              (( QUOTA_CPUS < EFFECTIVE_CPUS )) && EFFECTIVE_CPUS="$QUOTA_CPUS"
            fi
          elif [[ -r /sys/fs/cgroup/cpu/cpu.cfs_quota_us && -r /sys/fs/cgroup/cpu/cpu.cfs_period_us ]]; then
            CPU_QUOTA="$(cat /sys/fs/cgroup/cpu/cpu.cfs_quota_us)"
            CPU_PERIOD="$(cat /sys/fs/cgroup/cpu/cpu.cfs_period_us)"
            if [[ "$CPU_QUOTA" =~ ^[0-9]+$ && "$CPU_PERIOD" =~ ^[0-9]+$ && "$CPU_QUOTA" -gt 0 && "$CPU_PERIOD" -gt 0 ]]; then
              QUOTA_CPUS=$((CPU_QUOTA / CPU_PERIOD))
              (( QUOTA_CPUS < 1 )) && QUOTA_CPUS=1
              (( QUOTA_CPUS < EFFECTIVE_CPUS )) && EFFECTIVE_CPUS="$QUOTA_CPUS"
            fi
          fi

          if [[ -r /sys/fs/cgroup/memory.max ]]; then
            CGROUP_LIMIT="$(cat /sys/fs/cgroup/memory.max)"
            if [[ "$CGROUP_LIMIT" =~ ^[0-9]+$ ]]; then
              CGROUP_MEM_BYTES="$CGROUP_LIMIT"
              (( CGROUP_LIMIT < EFFECTIVE_MEM_BYTES )) && EFFECTIVE_MEM_BYTES="$CGROUP_LIMIT"
            fi
          elif [[ -r /sys/fs/cgroup/memory/memory.limit_in_bytes ]]; then
            CGROUP_LIMIT="$(cat /sys/fs/cgroup/memory/memory.limit_in_bytes)"
            if [[ "$CGROUP_LIMIT" =~ ^[0-9]+$ ]] && (( CGROUP_LIMIT < 1099511627776 )); then
              CGROUP_MEM_BYTES="$CGROUP_LIMIT"
              (( CGROUP_LIMIT < EFFECTIVE_MEM_BYTES )) && EFFECTIVE_MEM_BYTES="$CGROUP_LIMIT"
            fi
          fi

          WORKERS="$EFFECTIVE_CPUS"
          (( WORKERS > 4 )) && WORKERS=4
          (( WORKERS < 1 )) && WORKERS=1
          NATIVE_PARALLELISM="$WORKERS"

          sed -i '/^org\.gradle\.workers\.max=/d;/^android\.native\.buildParallelism=/d' gradle.properties
          {
            echo "org.gradle.workers.max=$WORKERS"
            echo "android.native.buildParallelism=$NATIVE_PARALLELISM"
          } >> gradle.properties

          EFFECTIVE_MEM_GIB=$((EFFECTIVE_MEM_BYTES / 1024 / 1024 / 1024))
          if (( EFFECTIVE_MEM_BYTES >= 12884901888 )); then
            sed -i '/^org\.gradle\.jvmargs=/d' gradle.properties
            echo "org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=2G -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties
            JVM_PROFILE="8G heap / 2G metaspace"
          else
            JVM_PROFILE="repository default (6G heap / 1G metaspace)"
          fi

          echo "===== GitHub Actions runner resource profile ====="
          echo "Host-visible CPUs (nproc): $HOST_CPUS"
          echo "Effective CPUs after cgroup quota: $EFFECTIVE_CPUS"
          echo "Host MemTotal: $((HOST_MEM_BYTES / 1024 / 1024 / 1024)) GiB"
          if [[ "$CGROUP_MEM_BYTES" == "unlimited" ]]; then
            echo "Cgroup memory limit: unlimited/not exposed"
          else
            echo "Cgroup memory limit: $((CGROUP_MEM_BYTES / 1024 / 1024 / 1024)) GiB"
          fi
          echo "Effective memory: ${EFFECTIVE_MEM_GIB} GiB"
          echo "Gradle workers: $WORKERS"
          echo "Native build parallelism: $NATIVE_PARALLELISM"
          echo "JVM profile: $JVM_PROFILE"

          # If this workflow changed a private repository to public, refuse to
          # spend a full Android build on a runner that still has private-tier
          # resources. The cleanup job will restore the original visibility.
          if [[ "$ORIGINAL_VISIBILITY" == "private" ]] && (( EFFECTIVE_CPUS < 4 || EFFECTIVE_MEM_BYTES < 12884901888 )); then
            echo "::error::Repository was made public before build allocation, but runner resources are below the expected public tier (CPUs=$EFFECTIVE_CPUS, memory=${EFFECTIVE_MEM_GIB} GiB). Aborting before Gradle."
            exit 1
          fi

          echo "cpu.max: $(cat /sys/fs/cgroup/cpu.max 2>/dev/null || echo unavailable)"
          echo "memory.max: $(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo unavailable)"
          free -h
          grep -E '^(org\.gradle\.jvmargs|org\.gradle\.workers\.max|android\.native\.buildParallelism)=' gradle.properties
      # 先跑纯规则测试（含本次新增的 seek 覆盖/远端片段/待重放状态机规则）。
      # 任何一项失败都会让该步骤退出码非零，后续 Gradle 构建不会执行，
      # 避免“测试失败但构建成功”的假通过。
      - name: Check preview rules
        run: |
          mkdir -p /tmp/preview-rules
          javac -d /tmp/preview-rules \
            TMessagesProj/src/test/java/org/telegram/ui/Components/preview/PreviewRulesTest.java \
            TMessagesProj/src/main/java/org/telegram/ui/Components/preview/PreviewRules.java \
            TMessagesProj/src/main/java/org/telegram/messenger/FragmentIndexRules.java \
            TMessagesProj/src/main/java/org/telegram/ui/Components/preview/TailMoovLocator.java \
            TMessagesProj/src/main/java/org/telegram/ui/Components/preview/DecodeGate.java \
            TMessagesProj/src/main/java/org/telegram/ui/Components/preview/RemoteFailureTracker.java \
            TMessagesProj/src/main/java/org/telegram/ui/Components/preview/SeekRules.java
          java -cp /tmp/preview-rules org.telegram.ui.Components.preview.PreviewRulesTest
          javac -d /tmp/preview-rules \
            TMessagesProj/src/test/java/org/telegram/ui/Components/preview/SeekRulesTest.java \
            TMessagesProj/src/main/java/org/telegram/ui/Components/preview/SeekRules.java
          java -cp /tmp/preview-rules org.telegram.ui.Components.preview.SeekRulesTest
          javac -d /tmp/preview-rules \
            TMessagesProj/src/test/java/org/telegram/ui/Components/seek/SeekCoverageRulesTest.java \
            TMessagesProj/src/test/java/org/telegram/ui/Components/seek/RemoteFragmentRulesTest.java \
            TMessagesProj/src/test/java/org/telegram/ui/Components/seek/PendingSeekRulesTest.java \
            TMessagesProj/src/main/java/org/telegram/ui/Components/seek/SeekCoverageRules.java \
            TMessagesProj/src/main/java/org/telegram/ui/Components/seek/RemoteFragmentRules.java \
            TMessagesProj/src/main/java/org/telegram/ui/Components/seek/PendingSeekRules.java
          java -cp /tmp/preview-rules org.telegram.ui.Components.seek.SeekCoverageRulesTest
          java -cp /tmp/preview-rules org.telegram.ui.Components.seek.RemoteFragmentRulesTest
          java -cp /tmp/preview-rules org.telegram.ui.Components.seek.PendingSeekRulesTest
          javac -d /tmp/preview-rules \
            TMessagesProj/src/main/java/org/telegram/messenger/FragmentMoofParser.java \
            TMessagesProj/src/test/java/org/telegram/messenger/FragmentMoofParserTest.java
          java -cp /tmp/preview-rules org.telegram.messenger.FragmentMoofParserTest
          javac -d /tmp/preview-rules \
            TMessagesProj/src/main/java/org/telegram/messenger/DownloadedRangeSnapshot.java \
            TMessagesProj/src/main/java/org/telegram/messenger/StreamRepositionRules.java \
            TMessagesProj/src/test/java/org/telegram/messenger/DownloadedRangeSnapshotTest.java \
            TMessagesProj/src/test/java/org/telegram/messenger/StreamRepositionRulesTest.java
          java -cp /tmp/preview-rules org.telegram.messenger.DownloadedRangeSnapshotTest
          java -cp /tmp/preview-rules org.telegram.messenger.StreamRepositionRulesTest
      - name: Set up Ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          append-timestamp: false
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true
      - name: Set up Gradle cache
        uses: actions/cache@v6
        with:
          # A fresh checkout otherwise throws away every compiled task output:
          # ~/.gradle holds dependencies and the Gradle build cache, while the
          # two .gradle dirs and the build dir hold the incremental state that
          # lets AGP skip unchanged Java/resource/native work.
          path: |
            ~/.gradle
            .gradle
            TMessagesProj/.gradle
            TMessagesProj/build
          key: build-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties', '**/gradle.properties') }}
          restore-keys: |
            build-
            gradle-
      - name: Set up Android SDK Tools
        uses: android-actions/setup-android@v4
        with:
          packages: "build-tools;36.0.0 ndk;27.2.12479018 platforms;android-37.0"
      - name: Install Native Build Dependencies
        run: |
          if ! command -v nasm >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends --yes nasm
          else
            echo "nasm is already installed"
          fi
      - name: Configure Android SDK Path
        run: |
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties
      # Builds on GitHub are signed with a throwaway key that lives in the
      # actions cache, never in the repository and never in secrets. The cache
      # keeps the key identical between runs so artifacts can install over
      # each other. If the cache is evicted a new key is generated and the
      # signature changes; bump the cache key below to force a deliberate one.
      - name: Restore CI signing key
        uses: actions/cache@v6
        with:
          path: TMessagesProj/release.keystore
          key: ci-signing-key-v1
      - name: Set up CI signing
        if: ${{ !startsWith(runner.os, 'Windows') }}
        run: |
          # The repository ships the upstream signing key, whose password CI
          # does not have. Replace anything that is not the cached throwaway
          # key with a fresh one; the cache keeps that key identical between
          # runs so CI artifacts can install over each other.
          if ! keytool -list -keystore TMessagesProj/release.keystore \
                 -storepass android -alias androiddebugkey >/dev/null 2>&1; then
            rm -f TMessagesProj/release.keystore
            keytool -genkeypair -v -keystore TMessagesProj/release.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=StreamX CI, OU=CI, O=StreamX, L=Internet, ST=Internet, C=US"
          fi
          {
            echo "KEYSTORE_PASS=android"
            echo "ALIAS_NAME=androiddebugkey"
            echo "ALIAS_PASS=android"
          } >> local.properties
      - name: Staging Build
        id: staging_build_step
        env:
          COMMIT_ID: ${{ github.sha }}
        run: |
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          export BUILD_TIMESTAMP=$(date +%s)
          echo "build_timestamp=$BUILD_TIMESTAMP" >> "$GITHUB_OUTPUT"
          ./gradlew TMessagesProj:assembleStaging
      # No Release is created here on purpose. The build only uploads an
      # artifact; nothing reaches a public URL until the phone check passes
      # and the manual publish workflow runs on that same artifact.
      - name: Write build info
        env:
          BUILD_TIMESTAMP: ${{ steps.staging_build_step.outputs.build_timestamp }}
        run: |
          META=TMessagesProj/build/outputs/apk/staging/output-metadata.json
          VERSION_NAME=$(jq -r '.elements[0].versionName' "$META")
          VERSION_CODE=$(jq -r '.elements[0].versionCode' "$META")
          BUILD_TIMESTAMP="${BUILD_TIMESTAMP:-0}"
          ARM64=$(ls TMessagesProj/build/outputs/apk/staging/*-arm64-v8a.apk | head -n1)
          ARM64_SHA=$(sha256sum "$ARM64" | cut -d' ' -f1)
          jq -n \
            --arg version "$VERSION_NAME" \
            --argjson versionCode "$VERSION_CODE" \
            --arg commit "$GITHUB_SHA" \
            --argjson builtAt "$BUILD_TIMESTAMP" \
            --arg notes "这一版改好了视频拖动时的画面预览，等待真机验收。" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runNumber "$GITHUB_RUN_NUMBER" \
            --arg arm64Sha "$ARM64_SHA" \
            '{version:$version, versionCode:$versionCode, commit:$commit, builtAt:$builtAt, notes:$notes, runId:$runId, runNumber:$runNumber, arm64Sha:$arm64Sha}' \
            > TMessagesProj/build/outputs/apk/staging/build-info.json
          cat TMessagesProj/build/outputs/apk/staging/build-info.json
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Staging
          path: |
            TMessagesProj/build/outputs/apk/staging/*-arm64-v8a.apk
            TMessagesProj/build/outputs/apk/staging/build-info.json

  restore_visibility:
    name: Restore repository visibility
    runs-on: ubuntu-latest
    needs:
      - prepare_visibility
      - build
    if: ${{ always() && needs.prepare_visibility.outputs.original_visibility == 'private' }}
    steps:
      - name: Restore private visibility
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::REPO_ADMIN_TOKEN is unavailable; repository may still be public."
            exit 1
          fi

          for attempt in 1 2 3; do
            current="$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)"
            if [[ "$current" == "private" ]]; then
              echo "Repository is already private."
              exit 0
            fi
            gh api -X PATCH "repos/$GITHUB_REPOSITORY" -f visibility=private || true
            sleep 2
            current="$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)"
            if [[ "$current" == "private" ]]; then
              echo "Repository restored to private (attempt $attempt)."
              exit 0
            fi
            echo "Visibility remains $current after attempt $attempt."
          done

          echo "::error::Failed to restore repository privacy after 3 attempts."
          exit 1
